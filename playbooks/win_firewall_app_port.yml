---
- name: Allow TCP port for application workload
  hosts: windows
  gather_facts: false
  tasks:
    - name: "Firewall rule {{ app_firewall_rule_name | default('AAP-LTSC-App-Port') }}"
      community.windows.win_firewall_rule:
        name: "{{ app_firewall_rule_name | default('AAP-LTSC-App-Port') }}"
        localport: "{{ app_tcp_port | default(8080) | int }}"
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true
