---
- name: Ensure controller staging directory for HTML reports
  ansible.builtin.file:
    path: "{{ compliance_report_controller_staging }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  run_once: true

- name: Render HTML compliance report
  ansible.builtin.template:
    src: compliance_report.html.j2
    dest: "{{ compliance_report_controller_staging }}/{{ inventory_hostname }}-compliance.html"
    mode: "0644"
  vars:
    report: "{{ compliance_report }}"
  delegate_to: localhost
  when: compliance_report_html_enabled | bool

- name: Ensure local HTML copy directory on Windows host
  ansible.windows.win_file:
    path: "{{ compliance_report_html_dir }}"
    state: directory
  when: compliance_report_html_enabled | bool

- name: Deploy HTML report file on Windows host
  ansible.windows.win_copy:
    src: "{{ compliance_report_controller_staging }}/{{ inventory_hostname }}-compliance.html"
    dest: "{{ compliance_report_html_path }}"
  when: compliance_report_html_enabled | bool

- name: Ensure IIS components for static HTML hosting
  ansible.windows.win_optional_feature:
    name: "{{ item }}"
    state: present
  loop: "{{ compliance_report_iis_features }}"
  register: iis_features
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Reboot when IIS installation requires it
  ansible.windows.win_reboot:
    pre_reboot_delay: 15
    reboot_timeout: 600
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool
    - compliance_report_iis_reboot | bool
    - iis_features.results | selectattr('reboot_required', 'equalto', true) | list | length > 0

- name: Query IIS World Wide Web Publishing Service
  ansible.windows.win_service_info:
    name: W3SVC
  register: w3svc_info
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Start IIS World Wide Web Publishing Service
  ansible.windows.win_service:
    name: W3SVC
    state: started
    start_mode: auto
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool
    - w3svc_info.exists | bool

- name: IIS not available after feature install
  ansible.builtin.fail:
    msg: >-
      IIS service W3SVC is not installed. Re-run this job after Windows finishes
      installing IIS (a reboot may have been required). To allow automatic reboot,
      set compliance_report_iis_reboot: true (default).
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool
    - not (w3svc_info.exists | default(false) | bool)

- name: Ensure IIS content directory
  ansible.windows.win_file:
    path: "{{ compliance_report_iis_path }}"
    state: directory
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Publish HTML as IIS site index
  ansible.windows.win_copy:
    src: "{{ compliance_report_controller_staging }}/{{ inventory_hostname }}-compliance.html"
    dest: "{{ compliance_report_iis_path }}/index.html"
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Publish HTML with full filename (direct URL)
  ansible.windows.win_copy:
    src: "{{ compliance_report_controller_staging }}/{{ inventory_hostname }}-compliance.html"
    dest: "{{ compliance_report_iis_path }}/AAP-LTSC-Compliance-Report.html"
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Remove site web.config (can cause HTTP 500 on static-only sites)
  ansible.windows.win_file:
    path: "{{ compliance_report_iis_path }}/web.config"
    state: absent
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Normalize IIS content path for PowerShell
  ansible.builtin.set_fact:
    compliance_report_iis_path_win: "{{ compliance_report_iis_path | replace('/', '\\\\') }}"
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Configure IIS site for compliance report (appcmd)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $appcmd = Join-Path $env:windir 'system32\inetsrv\appcmd.exe'
    if (-not (Test-Path -LiteralPath $appcmd)) {
      throw "IIS appcmd.exe not found. IIS-WebServerRole may still be installing."
    }
    $siteName = '{{ compliance_report_iis_site_name }}'
    $path = '{{ compliance_report_iis_path_win }}'
    $port = {{ compliance_report_http_port | int }}
    $binding = "http/*:${port}:"
    & $appcmd list apppool "$siteName" 2>$null | Out-Null
    if ($LASTEXITCODE -ne 0) {
      & $appcmd add apppool /name:$siteName
      if ($LASTEXITCODE -ne 0) { throw "appcmd add apppool failed (exit $LASTEXITCODE)" }
    }
    & $appcmd set apppool "$siteName" /managedRuntimeVersion:""
    & $appcmd list site "$siteName" 2>$null | Out-Null
    if ($LASTEXITCODE -ne 0) {
      & $appcmd add site /name:$siteName /physicalPath:$path /bindings:$binding
      if ($LASTEXITCODE -ne 0) { throw "appcmd add site failed (exit $LASTEXITCODE)" }
    } else {
      & $appcmd set site "$siteName" -physicalPath:$path
      & $appcmd set site "$siteName" /bindings:$binding
    }
    & $appcmd set app "$siteName/" /applicationPool:$siteName
    if ($LASTEXITCODE -ne 0) { throw "appcmd set app applicationPool failed (exit $LASTEXITCODE)" }
    & $appcmd clear config "$siteName/" -section:defaultDocument 2>$null | Out-Null
    & $appcmd clear config "$siteName/" -section:system.webServer/defaultDocument 2>$null | Out-Null
    $others = & $appcmd list sites /state:* /text:name
    foreach ($s in $others) {
      if ([string]::IsNullOrWhiteSpace($s)) { continue }
      $n = $s.Trim()
      if ($n -eq $siteName) { continue }
      & $appcmd set site $n "/-bindings.[protocol='http',bindingInformation='*:${port}:']" 2>$null | Out-Null
    }
    & $appcmd recycle apppool "$siteName"
    & $appcmd start apppool "$siteName"
    & $appcmd start site "$siteName"
    if ($LASTEXITCODE -ne 0) { throw "appcmd start site failed (exit $LASTEXITCODE)" }
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Grant IIS accounts read access to site folder
  ansible.windows.win_shell: |
    $path = '{{ compliance_report_iis_path_win }}'
    $siteName = '{{ compliance_report_iis_site_name }}'
    icacls $path /inheritance:e | Out-Null
    icacls $path /grant 'IIS_IUSRS:(OI)(CI)RX' /T | Out-Null
    icacls $path /grant 'IUSR:(OI)(CI)RX' /T | Out-Null
    icacls $path /grant "IIS AppPool\$($siteName):(OI)(CI)RX" /T | Out-Null
    icacls $path /grant "IIS AppPool\DefaultAppPool:(OI)(CI)RX" /T | Out-Null
    icacls $path /grant 'BUILTIN\Users:(OI)(CI)RX' /T | Out-Null
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Smoke test HTTP on localhost
  ansible.windows.win_shell: |
    $urls = @(
      'http://127.0.0.1:{{ compliance_report_http_port }}/',
      'http://127.0.0.1:{{ compliance_report_http_port }}/index.html',
      'http://127.0.0.1:{{ compliance_report_http_port }}/AAP-LTSC-Compliance-Report.html'
    )
    $results = foreach ($u in $urls) {
      try {
        $r = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 15
        [PSCustomObject]@{ url = $u; status = [int]$r.StatusCode; ok = $true }
      } catch {
        $code = $null
        if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode }
        [PSCustomObject]@{ url = $u; status = $code; ok = $false; error = $_.Exception.Message }
      }
    }
    $results | ConvertTo-Json -Compress
  register: http_smoke
  changed_when: false
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Show HTTP smoke test results
  ansible.builtin.debug:
    var: http_smoke.stdout | from_json
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Collect IIS diagnostics when HTTP smoke test fails
  ansible.windows.win_shell: |
    $siteName = '{{ compliance_report_iis_site_name }}'
    $path = '{{ compliance_report_iis_path_win }}'
    $appcmd = Join-Path $env:windir 'system32\inetsrv\appcmd.exe'
    $diag = [ordered]@{}
    $diag.sites = & $appcmd list site
    $diag.apppools = & $appcmd list apppool /state:*
    $diag.site_state = & $appcmd list site "$siteName" /state:*
    $diag.files = @(Get-ChildItem -LiteralPath $path -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length)" })
    $diag.web_config_exists = Test-Path -LiteralPath (Join-Path $path 'web.config')
    $logRoot = 'C:\inetpub\logs\LogFiles'
    if (Test-Path $logRoot) {
      $log = Get-ChildItem -Path $logRoot -Recurse -Filter '*.log' -ErrorAction SilentlyContinue |
        Sort-Object LastWriteTime -Descending | Select-Object -First 1
      if ($log) { $diag.last_iis_log_lines = Get-Content -LiteralPath $log.FullName -Tail 8 }
    }
    $diag | ConvertTo-Json -Depth 5 -Compress
  register: iis_diag
  changed_when: false
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool
    - (http_smoke.stdout | from_json | selectattr('ok', 'equalto', false) | list | length) > 0

- name: Show IIS diagnostics
  ansible.builtin.debug:
    var: iis_diag.stdout
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool
    - (http_smoke.stdout | from_json | selectattr('ok', 'equalto', false) | list | length) > 0

- name: Fail when localhost HTTP check does not return 200
  ansible.builtin.fail:
    msg: >-
      IIS returned an error for local HTTP checks: {{ http_smoke.stdout }}.
      Site content path is {{ compliance_report_iis_path }} (not Public Documents).
      IIS diagnostics: {{ iis_diag.stdout | default('n/a') }}.
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool
    - (http_smoke.stdout | from_json | selectattr('ok', 'equalto', false) | list | length) > 0

- name: Allow inbound TCP for compliance report HTTP (Windows Firewall)
  community.windows.win_firewall_rule:
    name: "{{ compliance_report_firewall_rule_name }}"
    localport: "{{ compliance_report_http_port | int }}"
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool
    - compliance_report_manage_firewall | bool

- name: Build compliance report browser URL
  ansible.builtin.set_fact:
    compliance_report_url: "http://{{ compliance_report_access_host }}:{{ compliance_report_http_port }}/"
  vars:
    compliance_report_access_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: Compliance report URLs for demo
  ansible.builtin.debug:
    msg:
      - "Browser URL (root): {{ compliance_report_url }}"
      - "Direct file URL: http://{{ compliance_report_access_host }}:{{ compliance_report_http_port }}/AAP-LTSC-Compliance-Report.html"
      - "IIS content folder (served): {{ compliance_report_iis_path }}"
      - "Local copy only (not served by IIS): {{ compliance_report_html_path }}"
      - "WinRM port 45986 is separate — it does not serve this HTML page."
      - "If remote access fails, allow TCP {{ compliance_report_http_port }} on cloud/network firewall (NSG)."
  vars:
    compliance_report_access_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
  when:
    - compliance_report_html_enabled | bool
    - compliance_report_http_enabled | bool

- name: HTML report file only (no HTTP server)
  ansible.builtin.debug:
    msg:
      - "Compliance HTML saved locally: {{ compliance_report_html_path }}"
      - "HTTP publishing disabled (compliance_report_http_enabled=false). Enable it to use http://<host-ip>:<port>/"
  when:
    - compliance_report_html_enabled | bool
    - not (compliance_report_http_enabled | bool)
