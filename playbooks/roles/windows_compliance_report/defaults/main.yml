---
# Read-only compliance profile for Windows 10 LTSC workstation demos.
# Not a full CIS/STIG scan — structured audit suitable for AAP reporting.

compliance_report_profile: ltsc_workstation
compliance_report_title: "Windows 10 LTSC Workstation Compliance Report"
compliance_report_version: "1.0"

# WARN if no hotfix within this many days (LTSC still needs patching)
compliance_max_patch_age_days: 90

# WARN if Defender signatures older than this many days
compliance_max_defender_signature_age_days: 7

# Minimum acceptable password length (CIS-aligned baseline)
compliance_min_password_length: 8

# HTML report
compliance_report_html_enabled: true
compliance_report_html_path: "C:/Users/Public/Documents/AAP-LTSC-Compliance-Report.html"
compliance_report_html_dir: "C:/Users/Public/Documents"
compliance_report_controller_staging: "/runner/project/reports"

# Publish report at http://<ansible_host>:<port>/ (requires IIS + firewall)
compliance_report_http_enabled: true
compliance_report_http_port: 8080
compliance_report_iis_site_name: AAP-Compliance
compliance_report_iis_path: "C:/inetpub/wwwroot/aap-compliance"
compliance_report_firewall_rule_name: AAP-LTSC-Compliance-HTTP
# Set false if port 8080 (or compliance_report_http_port) is already allowed on the host/cloud
compliance_report_manage_firewall: false
# Reboot automatically when IIS optional features require it (recommended for first run)
compliance_report_iis_reboot: true
compliance_report_iis_features:
  - IIS-WebServerRole
  - IIS-WebServerManagementTools
  - IIS-StaticContent
  - IIS-DefaultDocument
