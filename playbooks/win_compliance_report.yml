---
- name: Windows LTSC compliance report (read-only)
  hosts: windows
  gather_facts: false
  vars:
    # Override at job launch for stricter/looser baselines
    # compliance_max_patch_age_days: 60
    # compliance_min_password_length: 14
  tasks:
    - name: Run compliance report from windows_compliance_report role
      ansible.builtin.import_role:
        name: windows_compliance_report
        tasks_from: report
