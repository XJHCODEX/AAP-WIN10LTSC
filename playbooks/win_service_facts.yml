---
- name: Windows service facts (read-only)
  hosts: windows
  gather_facts: false
  tasks:
    - name: Service status matching filter
      ansible.windows.win_shell: |
        @(
          Get-Service -Name '{{ service_filter_name | default("*") }}' -ErrorAction SilentlyContinue |
            Select-Object -First 20 Name, Status, StartType
        ) | ConvertTo-Json -Compress
      register: svc_json
      changed_when: false

    - name: Display services
      ansible.builtin.debug:
        msg: "{{ item.Name }}: {{ item.Status }} ({{ item.StartType }})"
      vars:
        _svcs: "{{ svc_json.stdout | from_json }}"
      loop: "{{ _svcs if _svcs is sequence else [_svcs] }}"
      loop_control:
        label: "{{ item.Name }}"
